<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribeHub | My Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="customer-body">
    <nav class="navbar">
        <div class="logo">ScribeHub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <span id="user-email-badge" class="user-email-badge"></span>
            <a href="customer.html" class="active-link">My Library</a>
            <a href="login.html" onclick="logout()">Logout</a>
        </div>
    </nav>
    <main class="container">
        <header class="customer-header">
            <h1 id="customer-welcome-name">Welcome back, Reader</h1>
            <p>Manage your newsletter subscriptions and saved articles.</p>
        </header>
        <div class="grid-layout mt-2">
            <div class="main-content">
                <h2>📚 Saved Articles</h2>
                <div class="article-grid" id="saved-articles-grid">
                </div>
            </div>
            <aside class="sidebar">
                <div class="newsletter-widget">
                    <h3>🔔 My Subscription</h3>
                    <div class="subscription-item">
                        <div>
                            <p><strong>ScribeHub Weekly</strong></p>
                            <p style="font-size:0.8rem; color:#64748b; margin-top:0.25rem;">Premium newsletter</p>
                        </div>
                        <span id="sub-status-badge" class="badge draft-btn">Loading...</span>
                    </div>
                    <button class="btn-action full-width mt-1" id="sub-action-btn" onclick="toggleSubscription()">Buy Subscription</button>
                    <p style="font-size:0.75rem; color:#94a3b8; margin-top:0.75rem; text-align:center;">Cancel anytime.</p>
                </div>
                <div class="newsletter-widget" style="margin-top:1rem;">
                    <h3>🌐 Explore</h3>
                    <p style="color:#64748b; font-size:0.9rem; margin:0.75rem 0;">Discover new articles from ScribeHub.</p>
                    <a href="index.html" class="btn-outline full-width" style="display:block; text-align:center;">Browse Articles →</a>
                </div>
            </aside>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
