<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribeHub | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo text-center">ScribeHub</div>
            <h2 id="auth-title">Sign In</h2>
            <div class="toggle-group">
                <button class="login-toggle active-toggle" data-role="customer">Customer</button>
                <button class="login-toggle" data-role="admin">Admin</button>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email-input" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password-input" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-action full-width" id="btn-submit">Sign In</button>
                <button type="button" class="btn-outline full-width mt-1" id="btn-auth-mode">Need an account? Sign Up</button>
            </form>
            <p class="text-center mt-2"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
